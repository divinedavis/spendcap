name: Spendcap
options:
  bundleIdPrefix: com.divinedavis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "35"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

configs:
  Debug: debug
  Release: release

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.20.0"
  LinkKit:
    url: https://github.com/plaid/plaid-link-ios
    from: "6.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"

targets:
  Spendcap:
    type: application
    platform: iOS
    sources:
      - path: Spendcap
    resources:
      - path: Spendcap/Resources
        optional: true
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    info:
      path: Spendcap/Info.plist
      properties:
        CFBundleDisplayName: Spendcap
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        ITSAppUsesNonExemptEncryption: false
        CFBundleIconName: AppIcon
        UIBackgroundModes:
          - remote-notification
        SUPABASE_HOST: $(SUPABASE_HOST)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        # iOS OAuth client id, read by GoogleSignInService. Empty in a build
        # whose Secrets.xcconfig doesn't set it — the Google button then hides
        # itself rather than offering a tap that can only fail.
        GOOGLE_CLIENT_ID: $(GOOGLE_CLIENT_ID)
        # Google hands the OAuth result back through a custom scheme, which is
        # the client id with its dot-components reversed. Registering it is
        # what lets the account sheet return to the app at all.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.divinedavis.spendcap.google
            CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.divinedavis.spendcap
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CG89RY4W6R
        ENABLE_PREVIEWS: YES
        # Without this the AccentColor.colorset in Assets.xcassets is dead
        # weight: Color.accentColor and every .tint fall back to the system
        # blue, so the app shipped 24 builds looking like a stock template
        # while its icon was green. The asset has held the brand green since
        # 0001 — this is what connects it.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: Supabase
        product: Supabase
      - package: LinkKit
        product: LinkKit
      - package: GoogleSignIn
        product: GoogleSignIn
    entitlements:
      path: Spendcap/Spendcap.entitlements
      properties:
        aps-environment: production
        # Sign in with Apple. The matching APPLE_ID_AUTH capability is on the
        # App ID (scripts/asc_enable_capability.py APPLE_ID_AUTH); if the two
        # ever disagree, automatic signing fails with a provisioning error
        # that names neither of them.
        com.apple.developer.applesignin:
          - Default
        # Required for Plaid OAuth banks (Chase, BofA, Wells Fargo, Capital
        # One, US Bank, Schwab, PNC): the bank redirects back to
        # https://divinedavis.com/spendcap/oauth/, which must open the app as a
        # universal link. The AASA is served from that domain's
        # /.well-known/apple-app-site-association (shared with Hidden Gems).
        com.apple.developer.associated-domains:
          - applinks:divinedavis.com

  SpendcapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SpendcapTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.divinedavis.spendcap.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Spendcap

  SpendcapUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SpendcapUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.divinedavis.spendcap.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Spendcap

schemes:
  Spendcap:
    build:
      targets:
        Spendcap: all
        SpendcapTests: [test]
        SpendcapUITests: [test]
    test:
      targets:
        - SpendcapTests
        - SpendcapUITests
      gatherCoverageData: true
    run:
      config: Debug
    archive:
      config: Release
